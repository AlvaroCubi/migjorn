name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        # migjorn-py is a Python extension; it is built and linted in the Python
        # job (it needs a Python toolchain). Everything else is pure Rust.
        run: cargo clippy --workspace --exclude migjorn-py --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --exclude migjorn-py

  ruff:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Pinned so a new ruff release can't fail CI unexpectedly; bump deliberately.
      # `tests/` is the top-level Python acceptance suite (parsing, round-trip,
      # editing, stub drift); crates/migjorn-py holds the bindings + FFI tests.
      - name: ruff lint
        run: uvx ruff@0.15.21 check tests crates/migjorn-py
      - name: ruff format
        run: uvx ruff@0.15.21 format --check tests crates/migjorn-py

  python:
    name: Python (bindings + stub drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      # Builds the extension via maturin and installs it non-editably (so the
      # type stub lands on disk), then runs both suites: the top-level
      # tests/ acceptance suite (parsing, round-trip, editing, and stub drift —
      # tests/test_stub.py, which fails if migjorn.pyi and the runtime API
      # disagree) and crates/migjorn-py/tests, the PyO3-boundary tests.
      - name: Build, install & test
        run: uv run --no-project --with ./crates/migjorn-py --with pytest pytest tests crates/migjorn-py/tests -q
