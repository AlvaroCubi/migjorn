[workspace]
resolver = "2"
members = ["crates/migjorn-syntax", "crates/migjorn", "crates/migjorn-py"]
# The Python extension is built with maturin, not plain `cargo test`, so keep it
# out of the default set — `cargo test` / `cargo clippy` stay pure-Rust.
default-members = ["crates/migjorn-syntax", "crates/migjorn"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
migjorn-syntax = { path = "crates/migjorn-syntax", version = "0.1.0" }
compact_str = "0.9"
memchr = "2"
rayon = "1"
rustc-hash = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# NOTE: `panic = "abort"` must NEVER be set here. The Python extension needs
# panics to unwind so PyO3 can convert them into exceptions instead of aborting
# the host interpreter. See docs/01-goals-and-invariants.md.
panic = "unwind"
