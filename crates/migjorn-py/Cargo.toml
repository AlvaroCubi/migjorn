[package]
name = "migjorn-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# The Python import name. maturin builds this into the `migjorn` extension module.
name = "migjorn"
crate-type = ["cdylib"]

# Aliased so the crate's own lib name (`migjorn`, the Python module) does not
# collide with the core crate's name.
[dependencies]
migjorn_core = { package = "migjorn", path = "../migjorn" }

[dependencies.pyo3]
version = "0.23"
features = ["abi3-py39", "extension-module"]
