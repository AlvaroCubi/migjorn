[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "migjorn"
version = "0.1.0"
description = "Fast, lossless MCNP input parser and editor"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
module-name = "migjorn"
# maturin auto-detects the adjacent `migjorn.pyi` and ships it as
# `migjorn/__init__.pyi` with a `py.typed` marker (PEP 561).
